[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:auth-service]
directory=/app/backend/auth-service
command=node server.js
autostart=true
autorestart=true
environment=PORT="4001",NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:core-service]
directory=/app/backend/core-service
command=node server.js
autostart=true
autorestart=true
environment=PORT="4002",NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ai-service]
directory=/app/ai-service
command=python main.py
autostart=true
autorestart=true
environment=PORT="5000",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api-gateway]
directory=/app/backend/api-gateway
command=node server.js
autostart=true
autorestart=true
environment=PORT="4000",AUTH_SERVICE_URL="http://127.0.0.1:4001",CORE_SERVICE_URL="http://127.0.0.1:4002",AI_SERVICE_URL="http://127.0.0.1:5000",NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
