<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <!-- Dark emerald rounded-square background -->
  <rect width="40" height="40" rx="11" fill="#064e3b" />

  <!-- Outer emerald arc (bottom-left half of rescue loop) -->
  <path
    d="M20 9C13.373 9 8 14.373 8 21C8 27.627 13.373 33 20 33"
    stroke="#34d399"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Outer amber arc (top-right half of rescue loop) -->
  <path
    d="M20 33C26.627 33 32 27.627 32 21C32 14.373 26.627 9 20 9"
    stroke="#fbbf24"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Reload arrow tip on emerald arc -->
  <path
    d="M16.5 7.5L20 10L17 13"
    stroke="#34d399"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Leaf shape in center -->
  <path
    d="M20 14C20 14 26.5 16.5 25 22C23.5 26.5 17 25 17 21C17 17 20 14 20 14Z"
    fill="#ffffff"
    fill-opacity="0.95"
  />

  <!-- Leaf center stem -->
  <line
    x1="20"
    y1="20.5"
    x2="20"
    y2="25"
    stroke="#064e3b"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.6"
  />
</svg>
