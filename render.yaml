services:
  - type: web
    name: foodloop-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
