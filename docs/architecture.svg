<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#090d0b; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c17" />
      <stop offset="100%" stop-color="#0d1410" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Grid & Stars -->
  <g opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" />
    </pattern>
    <rect width="1200" height="800" fill="url(#grid)" />
  </g>

  <!-- Title & Header -->
  <text x="600" y="50" fill="#fef08a" font-size="26" font-weight="bold" text-anchor="middle" letter-spacing="1">🍽️ FOODLOOP SYSTEM ARCHITECTURE</text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">Multi-Tier Containerized Microservices &amp; Agentic AI Ecosystem (PS-04)</text>

  <!-- TIER 1: CLIENT LAYER -->
  <rect x="400" y="110" width="400" height="90" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
  <text x="600" y="145" fill="#34d399" font-size="18" font-weight="bold" text-anchor="middle">💻 FRONTEND WEB APP (SPA)</text>
  <text x="600" y="172" fill="#cbd5e1" font-size="13" text-anchor="middle">React 18 · Vite · TypeScript · Tailwind CSS · Nginx (:5173 / :80)</text>

  <!-- Connector from Client to Gateway -->
  <line x1="600" y1="200" x2="600" y2="250" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="600,255 595,245 605,245" fill="#f59e0b" />
  <text x="615" y="232" fill="#fde047" font-size="12" font-weight="600">HTTP/REST</text>

  <!-- TIER 2: API GATEWAY LAYER -->
  <rect x="350" y="260" width="500" height="90" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" />
  <text x="600" y="295" fill="#fbbf24" font-size="18" font-weight="bold" text-anchor="middle">🛡️ REVERSE PROXY API GATEWAY (Port 4000)</text>
  <text x="600" y="322" fill="#cbd5e1" font-size="13" text-anchor="middle">Node.js Express · Dynamic Path Rewrites · JWT Middleware · CORS</text>

  <!-- Connectors from Gateway to Services -->
  <!-- Left: Auth Service -->
  <path d="M 450 350 L 450 400 L 220 400 L 220 440" fill="none" stroke="#38bdf8" stroke-width="2" />
  <polygon points="220,445 215,435 225,435" fill="#38bdf8" />
  <text x="310" y="392" fill="#7dd3fc" font-size="11">/api/auth</text>

  <!-- Center: Core Service -->
  <line x1="600" y1="350" x2="600" y2="440" stroke="#10b981" stroke-width="2" />
  <polygon points="600,445 595,435 605,435" fill="#10b981" />
  <text x="615" y="405" fill="#6ee7b7" font-size="11">/api/food, /requests</text>

  <!-- Right: AI Service -->
  <path d="M 750 350 L 750 400 L 980 400 L 980 440" fill="none" stroke="#c084fc" stroke-width="2" />
  <polygon points="980,445 975,435 985,435" fill="#c084fc" />
  <text x="840" y="392" fill="#e9d5ff" font-size="11">/api/ai</text>

  <!-- TIER 3: MICROSERVICES LAYER -->
  <!-- 1. Auth Service -->
  <rect x="80" y="450" width="280" height="150" rx="14" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="2" />
  <text x="220" y="485" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">🔑 AUTH SERVICE (:4001)</text>
  <text x="220" y="515" fill="#94a3b8" font-size="12" text-anchor="middle">• User &amp; Role Management</text>
  <text x="220" y="538" fill="#94a3b8" font-size="12" text-anchor="middle">• JWT Sign &amp; Verify (24h)</text>
  <text x="220" y="561" fill="#94a3b8" font-size="12" text-anchor="middle">• Municipal Verification</text>

  <!-- 2. Core Service -->
  <rect x="440" y="450" width="320" height="150" rx="14" fill="url(#cardGrad)" stroke="#059669" stroke-width="2" />
  <text x="600" y="485" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">🍲 CORE SERVICE (:4002)</text>
  <text x="600" y="515" fill="#94a3b8" font-size="12" text-anchor="middle">• Surplus Listings CRUD</text>
  <text x="600" y="538" fill="#94a3b8" font-size="12" text-anchor="middle">• Claims &amp; Verification Flow</text>
  <text x="600" y="561" fill="#94a3b8" font-size="12" text-anchor="middle">• Hourly Auto-Expire Cron</text>
  <text x="600" y="584" fill="#94a3b8" font-size="12" text-anchor="middle">• Impact &amp; Barakah Aggregator</text>

  <!-- 3. AI Service -->
  <rect x="830" y="450" width="300" height="150" rx="14" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="2" />
  <text x="980" y="485" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">🧠 AI &amp; MATCH SERVICE (:5000)</text>
  <text x="980" y="515" fill="#94a3b8" font-size="12" text-anchor="middle">• LangChain RAG (Food Safety)</text>
  <text x="980" y="538" fill="#94a3b8" font-size="12" text-anchor="middle">• Agentic Matchmaker Loop</text>
  <text x="980" y="561" fill="#94a3b8" font-size="12" text-anchor="middle">• Groq High-Speed LLM</text>
  <text x="980" y="584" fill="#94a3b8" font-size="12" text-anchor="middle">• Python OOP Math Engine</text>

  <!-- Connectors to Persistence Layer -->
  <!-- Auth -> MongoDB -->
  <line x1="220" y1="600" x2="380" y2="675" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
  <!-- Core -> MongoDB -->
  <line x1="600" y1="600" x2="520" y2="675" stroke="#059669" stroke-width="1.5" />
  <!-- AI -> RAG Knowledge Base & Groq -->
  <line x1="980" y1="600" x2="900" y2="675" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- TIER 4: PERSISTENCE & EXTERNAL SERVICES -->
  <!-- MongoDB Atlas -->
  <rect x="300" y="675" width="340" height="85" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="470" y="708" fill="#a7f3d0" font-size="15" font-weight="bold" text-anchor="middle">🍃 MONGODB DATABASE</text>
  <text x="470" y="735" fill="#ecfdf5" font-size="12" text-anchor="middle">Users · FoodListings · Requests · Organizations</text>

  <!-- External AI & Knowledge -->
  <rect x="740" y="675" width="360" height="85" rx="12" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
  <text x="920" y="708" fill="#e9d5ff" font-size="15" font-weight="bold" text-anchor="middle">⚡ GROQ INFERENCE &amp; RAG KB</text>
  <text x="920" y="735" fill="#f3e8ff" font-size="12" text-anchor="middle">Groq LLM · LangChain · Safety Guidelines KB</text>
</svg>
