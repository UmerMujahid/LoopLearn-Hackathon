<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#0a0e0c; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="45" fill="#fef08a" font-size="24" font-weight="bold" text-anchor="middle">🍃 FOODLOOP MONGODB SCHEMA &amp; RELATIONSHIPS</text>
  <text x="600" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Document Schemas, Foreign References &amp; Enums</text>

  <!-- TABLE 1: USERS -->
  <g transform="translate(60, 110)">
    <rect width="320" height="520" rx="12" fill="#121815" stroke="#0284c7" stroke-width="2" />
    <rect width="320" height="45" rx="12" fill="url(#headerGrad1)" />
    <text x="160" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">👤 Users Collection</text>
    
    <!-- Fields -->
    <text x="20" y="75" fill="#38bdf8" font-size="12" font-family="monospace">_id: ObjectId [PK]</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="12">name: <tspan fill="#94a3b8">String (Required)</tspan></text>
    <text x="20" y="135" fill="#cbd5e1" font-size="12">email: <tspan fill="#94a3b8">String (Unique, Required)</tspan></text>
    <text x="20" y="165" fill="#cbd5e1" font-size="12">password: <tspan fill="#94a3b8">String (Bcrypt Hash)</tspan></text>
    <text x="20" y="195" fill="#fde047" font-size="12" font-weight="600">role: <tspan fill="#f59e0b">'provider'|'organization'|'admin'</tspan></text>
    <text x="20" y="225" fill="#cbd5e1" font-size="12">organizationName: <tspan fill="#94a3b8">String</tspan></text>
    <text x="20" y="255" fill="#cbd5e1" font-size="12">address: <tspan fill="#94a3b8">String (Required)</tspan></text>
    <text x="20" y="285" fill="#cbd5e1" font-size="12">phone: <tspan fill="#94a3b8">String (Required)</tspan></text>
    <text x="20" y="315" fill="#cbd5e1" font-size="12">isVerified: <tspan fill="#94a3b8">Boolean (Default: false)</tspan></text>
    <text x="20" y="345" fill="#cbd5e1" font-size="12">lat: <tspan fill="#94a3b8">Number</tspan></text>
    <text x="20" y="375" fill="#cbd5e1" font-size="12">lng: <tspan fill="#94a3b8">Number</tspan></text>
    <text x="20" y="405" fill="#cbd5e1" font-size="12">preferredCategories: <tspan fill="#94a3b8">[String]</tspan></text>
    <text x="20" y="435" fill="#cbd5e1" font-size="12">createdAt: <tspan fill="#94a3b8">Date</tspan></text>
    <text x="20" y="465" fill="#cbd5e1" font-size="12">updatedAt: <tspan fill="#94a3b8">Date</tspan></text>
  </g>

  <!-- TABLE 2: FOOD LISTINGS -->
  <g transform="translate(440, 110)">
    <rect width="320" height="520" rx="12" fill="#121815" stroke="#059669" stroke-width="2" />
    <rect width="320" height="45" rx="12" fill="url(#headerGrad2)" />
    <text x="160" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">🥗 FoodListings Collection</text>
    
    <!-- Fields -->
    <text x="20" y="75" fill="#34d399" font-size="12" font-family="monospace">_id: ObjectId [PK]</text>
    <text x="20" y="105" fill="#38bdf8" font-size="12" font-family="monospace">providerId: ObjectId [FK -> Users]</text>
    <text x="20" y="135" fill="#cbd5e1" font-size="12">foodName: <tspan fill="#94a3b8">String (Required)</tspan></text>
    <text x="20" y="165" fill="#cbd5e1" font-size="12">category: <tspan fill="#94a3b8">Enum ('cooked'|'produce'|...)</tspan></text>
    <text x="20" y="195" fill="#cbd5e1" font-size="12">quantity: <tspan fill="#94a3b8">Number (Required)</tspan></text>
    <text x="20" y="225" fill="#cbd5e1" font-size="12">unit: <tspan fill="#94a3b8">'portions'|'kg'|'boxes'|'liters'</tspan></text>
    <text x="20" y="255" fill="#cbd5e1" font-size="12">pickupLocation: <tspan fill="#94a3b8">String (Required)</tspan></text>
    <text x="20" y="285" fill="#cbd5e1" font-size="12">availableFrom: <tspan fill="#94a3b8">Date</tspan></text>
    <text x="20" y="315" fill="#cbd5e1" font-size="12">availableUntil: <tspan fill="#94a3b8">Date</tspan></text>
    <text x="20" y="345" fill="#cbd5e1" font-size="12">expiryDate: <tspan fill="#94a3b8">Date (Required)</tspan></text>
    <text x="20" y="375" fill="#fde047" font-size="12" font-weight="600">status: <tspan fill="#f59e0b">'available'|'reserved'|'collected'|'expired'</tspan></text>
    <text x="20" y="405" fill="#cbd5e1" font-size="12">description: <tspan fill="#94a3b8">String</tspan></text>
    <text x="20" y="435" fill="#38bdf8" font-size="12" font-family="monospace">claimedBy: ObjectId [FK -> Users]</text>
    <text x="20" y="465" fill="#cbd5e1" font-size="12">dietaryTags: <tspan fill="#94a3b8">['halal'|'veg'|'vegan'|'nut-free']</tspan></text>
  </g>

  <!-- TABLE 3: REQUESTS / CLAIMS -->
  <g transform="translate(820, 110)">
    <rect width="320" height="520" rx="12" fill="#121815" stroke="#d97706" stroke-width="2" />
    <rect width="320" height="45" rx="12" fill="url(#headerGrad3)" />
    <text x="160" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">📋 Requests Collection</text>
    
    <!-- Fields -->
    <text x="20" y="75" fill="#fbbf24" font-size="12" font-family="monospace">_id: ObjectId [PK]</text>
    <text x="20" y="105" fill="#34d399" font-size="12" font-family="monospace">foodListingId: ObjectId [FK -> Food]</text>
    <text x="20" y="135" fill="#38bdf8" font-size="12" font-family="monospace">organizationId: ObjectId [FK -> Users]</text>
    <text x="20" y="165" fill="#38bdf8" font-size="12" font-family="monospace">providerId: ObjectId [FK -> Users]</text>
    <text x="20" y="195" fill="#cbd5e1" font-size="12">requestedQuantity: <tspan fill="#94a3b8">Number</tspan></text>
    <text x="20" y="225" fill="#fde047" font-size="12" font-weight="600">status: <tspan fill="#f59e0b">'pending'|'approved'|'rejected'|'collected'</tspan></text>
    <text x="20" y="255" fill="#cbd5e1" font-size="12">notes: <tspan fill="#94a3b8">String</tspan></text>
    <text x="20" y="285" fill="#cbd5e1" font-size="12">pickupTime: <tspan fill="#94a3b8">Date</tspan></text>
    <text x="20" y="315" fill="#cbd5e1" font-size="12">collectedAt: <tspan fill="#94a3b8">Date</tspan></text>
    <text x="20" y="345" fill="#cbd5e1" font-size="12">createdAt: <tspan fill="#94a3b8">Date</tspan></text>
    <text x="20" y="375" fill="#cbd5e1" font-size="12">updatedAt: <tspan fill="#94a3b8">Date</tspan></text>
  </g>

  <!-- Connectors -->
  <!-- Users to FoodListings (1:N) -->
  <line x1="380" y1="215" x2="440" y2="215" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="380" cy="215" r="3" fill="#38bdf8" />
  <polygon points="440,215 432,210 432,220" fill="#38bdf8" />

  <!-- FoodListings to Requests (1:N) -->
  <line x1="760" y1="215" x2="820" y2="215" stroke="#34d399" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="760" cy="215" r="3" fill="#34d399" />
  <polygon points="820,215 812,210 812,220" fill="#34d399" />
</svg>
